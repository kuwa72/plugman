name: CI & Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create a GitHub Release'
        type: boolean
        default: false
      tag_name:
        description: 'Tag name for release (optional if tag triggered)'
        type: string
        default: ''

permissions:
  contents: write

jobs:
  build:
    name: Build & Package (Windows x64)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install MinGW C++ Compiler & Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-mingw-w64-x86-64 zip

      - name: Install dependencies
        run: npm ci

      - name: Build Application & Package ZIP
        run: ./scripts/build.sh --zip

      - name: Generate Checksum
        run: sha256sum Plugman-win32-x64.zip > Plugman-win32-x64.zip.sha256

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Plugman-win32-x64
          path: |
            Plugman-win32-x64.zip
            Plugman-win32-x64.zip.sha256

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.create_release == true)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name != '' && github.event.inputs.tag_name || github.ref_name }}
          files: |
            Plugman-win32-x64.zip
            Plugman-win32-x64.zip.sha256
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
